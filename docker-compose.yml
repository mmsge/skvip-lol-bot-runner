# mastobots — a house for Mastodon robots. Repo: mmsge/skvip-lol-bot-runner.
name: mastobots            # pin the Compose project name — a dir rename can't orphan named volumes

services:
  mastobots:
    build: .
    restart: unless-stopped
    mem_limit: 256m        # the box is small (3.7 GB / 2 vCPU) — always cap memory
    # Publish where central Caddy can dial it: the bridge gateway 172.18.0.1:PORT
    # (kept off the public interface) or 0.0.0.0:PORT — never 127.0.0.1.
    ports:
      - "172.18.0.1:4010:8080"
    env_file: .env         # MASTODON tokens + per-bot config (see .env.example)
    volumes:
      # The seen-store. Losing it means every bot re-marks the current corpus as
      # seen on next boot (BACKFILL=0), so nothing double-posts — but the volume
      # is what keeps that from happening at all.
      - mastobots-data:/app/data
      # linjeskift's SQLite database, written by the linjeskift service. The
      # mount is read-write although the runner opens the DB `readOnly`: a
      # reader of a WAL database must be able to create and write the -shm and
      # -wal files beside it. See ADR 0010 and the README's deploy notes.
      - /var/lib/linjeskift:/linjeskift
    # The container user has no rights on the host's /var/lib/linjeskift. The
    # directory is group-owned by a group on the host, and the container joins
    # that group by number. Set LINJESKIFT_GID in .env to the host group's GID.
    group_add:
      - "${LINJESKIFT_GID:-10001}"
    # Cap the container log. The runtime is the transport for the central `logg`
    # service (logs.msge.no), so this file IS part of the logging pipeline — and
    # without these options the json-file driver never rotates. The product
    # max-size x max-file is also how much output survives a logg outage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s   # grace while the app boots before failures count

volumes:
  mastobots-data:
